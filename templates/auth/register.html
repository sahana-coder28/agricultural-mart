{% extends "base.html" %}

{% block title %}Register - AgroMart{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 70vh;">
    <div class="glass-card" style="width: 100%; max-width: 400px;">
        <h2 style="text-align: center; margin-bottom: 2rem; color: var(--primary-color);">Join AgroMart</h2>
        
        <form method="POST" action="{{ url_for('auth.register') }}" autocomplete="off">
            <!-- Hidden decoy fields to prevent browser autocomplete -->
            <input type="text" name="fake_user" style="display:none;" tabindex="-1" autocomplete="username">
            <input type="password" name="fake_pass" style="display:none;" tabindex="-1" autocomplete="current-password">
            
            <div class="form-group">
                <label for="username">Full Name / Username</label>
                <input type="text" class="form-control" id="username" name="username" required placeholder="Enter your username" pattern="[A-Za-z\s]+" title="Name should accept only letters">
            </div>
            
            <div class="form-group">
                <label for="user_email">Email Address</label>
                <input type="email" class="form-control" id="user_email" name="user_email" required placeholder="Enter your email" autocomplete="new-password">
            </div>
            
            <div class="form-group">
                <label for="user_password">Password</label>
                <input type="password" class="form-control" id="user_password" name="user_password" required placeholder="Create a password" pattern="(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@$!%*?&]).{8,}" title="Must contain at least 8 or more characters, one number, one uppercase, one lowercase letter, and one special symbol" autocomplete="new-password">
            </div>
            
            <div class="form-group">
                <label for="role">I am a</label>
                <select class="form-control" id="role" name="role">
                    <option value="customer">Customer / Buyer</option>
                    <option value="farmer">Farmer / Seller</option>
                </select>
            </div>
            
            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;">Create Account</button>
        </form>
        
        <p style="text-align: center; margin-top: 1.5rem; font-size: 0.9rem;">
            Already have an account? <a href="{{ url_for('auth.login') }}" style="color: var(--primary-color); font-weight: 600;">Login here</a>
        </p>
    </div>
</div>
{% endblock %}
