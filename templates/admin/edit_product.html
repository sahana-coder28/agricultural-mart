{% extends "admin/admin_base.html" %}

{% block title %}Edit Product - AgroMart{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: flex-start; min-height: 70vh; margin-top: 2rem;">
    <div class="glass-card" style="width: 100%; max-width: 600px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2 style="color: var(--primary-color);">Edit Product #{{ product.id }}</h2>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary" style="padding: 0.4rem 0.8rem;"><i
                    class="fas fa-arrow-left"></i> Back</a>
        </div>

        <form method="POST" action="{{ url_for('admin.edit_product', product_id=product.id) }}" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" class="form-control" id="name" name="name" value="{{ product.name }}" required>
            </div>

            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label for="category">Category</label>
                    <select class="form-control" id="category" name="category" required>
                        <option value="seeds" {% if product.category == 'seeds' %}selected{% endif %}>Seeds</option>
                        <option value="fertilizers" {% if product.category == 'fertilizers' %}selected{% endif %}>Fertilizers</option>
                        <option value="pesticides" {% if product.category == 'pesticides' %}selected{% endif %}>Pesticides</option>
                        <option value="irrigation" {% if product.category == 'irrigation' %}selected{% endif %}>Irrigation Equipment</option>
                        <option value="tools" {% if product.category == 'tools' %}selected{% endif %}>Tools & Machinery</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="price">Price (₹)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="price" name="price" value="{{ product.price }}" required>
                </div>
            </div>

            <div class="form-group">
                <label for="stock">Available Stock</label>
                <input type="number" min="0" class="form-control" id="stock" name="stock" value="{{ product.stock }}" required>
            </div>

            <div class="form-group">
                <label for="description">Product Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" required>{{ product.description }}</textarea>
            </div>

            <div class="form-group">
                <label for="image">Replace Image (Optional)</label>
                <div style="margin-bottom: 10px;">
                    <img src="{{ url_for('static', filename=product.image_url) }}" alt="Current Image" style="width: 80px; height: 80px; object-fit: cover; border-radius: 4px;">
                </div>
                <input type="file" class="form-control" id="image" name="image" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; font-size: 1.1rem; padding: 1rem; margin-top: 1rem;">
                <i class="fas fa-save"></i> Save Changes
            </button>
        </form>
    </div>
</div>
{% endblock %}
