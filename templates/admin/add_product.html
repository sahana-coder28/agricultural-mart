{% extends "admin/admin_base.html" %}

{% block title %}Add Product - AgroMart{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: flex-start; min-height: 70vh; margin-top: 2rem;">
    <div class="glass-card" style="width: 100%; max-width: 600px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2 style="color: var(--primary-color);">Add New Product</h2>
            <a href="{{ url_for('admin.dashboard') }}" class="btn btn-secondary" style="padding: 0.4rem 0.8rem;"><i
                    class="fas fa-arrow-left"></i> Back</a>
        </div>

        <form method="POST" action="{{ url_for('admin.add_product') }}" enctype="multipart/form-data">
            <div class="form-group">
                <label for="name">Product Name</label>
                <input type="text" class="form-control" id="name" name="name" required
                    placeholder="e.g. Organic Tomato Seeds">
            </div>

            <div style="display: flex; gap: 1rem;">
                <div class="form-group" style="flex: 1;">
                    <label for="category">Category</label>
                    <select class="form-control" id="category" name="category" required>
                        <option value="seeds">Seeds</option>
                        <option value="fertilizers">Fertilizers</option>
                        <option value="pesticides">Pesticides</option>
                        <option value="irrigation">Irrigation Equipment</option>
                        <option value="tools">Tools & Machinery</option>
                    </select>
                </div>
                <div class="form-group" style="flex: 1;">
                    <label for="price">Price (₹)</label>
                    <input type="number" step="0.01" min="0.01" class="form-control" id="price" name="price" required
                        placeholder="0.00">
                </div>
            </div>

            <div class="form-group">
                <label for="stock">Available Stock</label>
                <input type="number" min="0" class="form-control" id="stock" name="stock" required
                    placeholder="Quantity in stock">
            </div>

            <div class="form-group">
                <label for="description">Product Description</label>
                <textarea class="form-control" id="description" name="description" rows="4" required
                    placeholder="Detailed description of the product..."></textarea>
            </div>

            <div class="form-group">
                <label for="image">Product Image</label>
                <input type="file" class="form-control" id="image" name="image" accept="image/*">
            </div>

            <button type="submit" class="btn btn-primary"
                style="width: 100%; font-size: 1.1rem; padding: 1rem; margin-top: 1rem;">
                <i class="fas fa-plus"></i> List Product
            </button>
        </form>
    </div>
</div>
{% endblock %}
