{% extends "base.html" %}

{% block title %}Edit Profile - AgroMart{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: flex-start; min-height: 70vh; margin-top: 2rem;">
    <div class="glass-card" style="width: 100%; max-width: 500px;">
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem;">
            <h2><i class="fas fa-user-edit" style="color:var(--primary-color)"></i> Edit Profile</h2>
            <a href="{{ url_for('user.profile') }}" class="btn btn-secondary" style="padding: 0.4rem 0.8rem;"><i class="fas fa-arrow-left"></i> Back</a>
        </div>

        <form method="POST" action="{{ url_for('user.edit_profile') }}">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" class="form-control" id="username" name="username" value="{{ current_user.username }}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email</label>
                <input type="email" class="form-control" id="email" name="email" value="{{ current_user.email }}" required>
            </div>
            
            <div class="form-group">
                <label>Account Role</label>
                <input type="text" class="form-control" value="{{ current_user.role|capitalize }}" disabled style="background-color: #f1f2f6;">
                <small style="color: var(--text-light);">Role modification is not allowed.</small>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem;"><i class="fas fa-save"></i> Save Profile</button>
        </form>
    </div>
</div>
{% endblock %}
