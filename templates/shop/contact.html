{% extends "base.html" %}

{% block title %}Contact Us - AgroMart{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: flex-start; min-height: 70vh; margin-top: 2rem;">
    <div class="glass-card" style="width: 100%; max-width: 600px;">
        <div style="text-align: center; margin-bottom: 2rem;">
            <h2 style="color: var(--primary-color);"><i class="fas fa-envelope-open-text"></i> Contact Us</h2>
            <p style="color: var(--text-light); margin-top: 0.5rem;">Have questions? Send us a message and we'll reply shortly.</p>
        </div>

        <form method="POST" action="{{ url_for('main.contact') }}">
            <div class="form-group">
                <label for="name">Your Name</label>
                <input type="text" class="form-control" id="name" name="name" 
                    value="{% if current_user.is_authenticated %}{{ current_user.username }}{% endif %}" required>
            </div>
            
            <div class="form-group">
                <label for="email">Email Address</label>
                <input type="email" class="form-control" id="email" name="email" 
                    value="{% if current_user.is_authenticated %}{{ current_user.email }}{% endif %}" required>
            </div>
            
            <div class="form-group">
                <label for="message">Message</label>
                <textarea class="form-control" id="message" name="message" rows="5" required placeholder="How can we help you?"></textarea>
            </div>

            <button type="submit" class="btn btn-primary" style="width: 100%; margin-top: 1rem; font-size: 1.1rem; padding: 1rem;">
                <i class="fas fa-paper-plane"></i> Send Message
            </button>
        </form>
    </div>
</div>
{% endblock %}
